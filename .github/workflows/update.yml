name: Ενημέρωση δεδομένων & δημοσίευση

on:
  schedule:
    # Ώρες UTC. Τρίτη, Παρασκευή, Σάββατο, Κυριακή πρωί.
    - cron: '0 7 * * 2,5,6,0'
    - cron: '0 15 * * 5'
  workflow_dispatch: {}   # χειροκίνητο κουμπί «Run workflow»
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: npm test
      - name: Λήψη δεδομένων
        if: github.event_name != 'push'
        run: npm run update
      - name: Αποθήκευση data.json στο repo
        if: github.event_name != 'push'
        run: |
          git config user.name "draw-signals-bot"
          git config user.email "draw-signals-bot@users.noreply.github.com"
          git add public/data.json
          git diff --cached --quiet || git commit -m "Ενημέρωση δεδομένων $(date -u +%F)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
